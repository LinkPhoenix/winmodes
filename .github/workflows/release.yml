name: Release

# Push a tag such as v0.3.0 to build, test, package (installer and portable zip) and publish a GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: the changelog fallback lists the commits since the previous tag.
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Check the tag
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          $projectVersion = ([xml](Get-Content -LiteralPath src/WinModes.App/WinModes.App.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($tagVersion -ne $projectVersion) { throw "Tag $tagVersion does not match <Version> $projectVersion in WinModes.App.csproj." }
          git fetch --no-tags origin main
          git merge-base --is-ancestor '${{ github.sha }}' origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The tagged commit is not on main.' }

      - name: Build and test
        run: |
          dotnet restore --locked-mode
          dotnet build --nologo -c Release --no-restore
          dotnet test --nologo -c Release --no-build

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Package (portable zip and installer)
        shell: pwsh
        env:
          # The private key that signs SHA256SUMS.txt; empty until the secret is created (see tools/new-update-key.ps1).
          WINMODES_UPDATE_KEY: ${{ secrets.WINMODES_UPDATE_KEY }}
        run: pwsh -NoProfile -File tools/package.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v')) -RequireInstaller

      - name: Release notes
        shell: pwsh
        run: pwsh -NoProfile -File tools/release-notes.ps1 -Tag '${{ github.ref_name }}' -OutputPath release-notes.md

      - name: Create GitHub release
        shell: pwsh
        run: |
          $assets = Get-ChildItem artifacts -File | ForEach-Object FullName
          gh release create '${{ github.ref_name }}' @assets --title "WinModes ${{ github.ref_name }}" --notes-file release-notes.md
