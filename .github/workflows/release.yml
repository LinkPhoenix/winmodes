name: Release

# Push a tag such as v0.2.0 to build, test, package and publish a GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the changelog fallback lists the commits since the previous tag.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and test
        run: |
          dotnet build --nologo -c Release
          dotnet test --nologo -c Release --no-build

      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $out = "publish/WinModes"
          dotnet publish src/WinModes.App -c Release -r win-x64 --self-contained true -o $out --nologo -p:Version=$version
          # The app and the elevated helper look for these next to the executable.
          New-Item -ItemType Directory -Force "$out/data" | Out-Null
          Copy-Item data/protected.json "$out/data/"
          Copy-Item profiles "$out/profiles" -Recurse
          Copy-Item LICENSE.md, README.md, CHANGELOG.md $out
          Compress-Archive -Path $out -DestinationPath "WinModes-${{ github.ref_name }}-win-x64.zip"

      - name: Release notes
        shell: pwsh
        run: pwsh -NoProfile -File tools/release-notes.ps1 -Tag '${{ github.ref_name }}' -OutputPath release-notes.md

      - name: Create GitHub release
        shell: pwsh
        run: gh release create '${{ github.ref_name }}' "WinModes-${{ github.ref_name }}-win-x64.zip" --title "WinModes ${{ github.ref_name }}" --notes-file release-notes.md
