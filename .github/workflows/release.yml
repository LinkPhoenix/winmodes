name: Release

# Push a tag such as v0.3.0 to build, test, package (installer and portable zip) and publish a GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the changelog fallback lists the commits since the previous tag.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and test
        run: |
          dotnet build --nologo -c Release
          dotnet test --nologo -c Release --no-build

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Package (portable zip and installer)
        shell: pwsh
        run: pwsh -NoProfile -File tools/package.ps1 -Version '${{ github.ref_name }}'.TrimStart('v') -RequireInstaller

      - name: Release notes
        shell: pwsh
        run: pwsh -NoProfile -File tools/release-notes.ps1 -Tag '${{ github.ref_name }}' -OutputPath release-notes.md

      - name: Create GitHub release
        shell: pwsh
        run: |
          $assets = Get-ChildItem artifacts -File | ForEach-Object FullName
          gh release create '${{ github.ref_name }}' @assets --title "WinModes ${{ github.ref_name }}" --notes-file release-notes.md
