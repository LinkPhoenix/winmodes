name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Fails when a package version differs from packages.lock.json; update it with `dotnet restore --force-evaluate`.
      - run: dotnet restore --locked-mode
      - run: dotnet build --nologo --no-restore
      - run: dotnet test --nologo --no-build
