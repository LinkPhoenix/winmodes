name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # Fails when a package version differs from packages.lock.json; update it with `dotnet restore --force-evaluate`.
      - run: dotnet restore --locked-mode
      - run: dotnet build --nologo --no-restore
      - run: dotnet test --nologo --no-build
